
name: Build EmuDrop ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv git

      - name: Get EmuDrop source
        run: |
          git clone https://github.com/ahmadteeb/EmuDrop.git upstream

      - name: Apply RG DS Plus patch
        run: |
          cd upstream
          git apply ../navigation.patch

      - name: Build ARM64 executable
        run: |
          cd upstream
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip pyinstaller
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pyinstaller --onefile --name EmuDrop main.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: EmuDrop-RGDSPlus-ARM64
          path: upstream/dist/EmuDrop
